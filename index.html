<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Keep these three in the page's voice: an agency, "we". -->
    <title>ELYSIAN — websites and applications, built in Cairo</title>
    <meta
      name="description"
      content="ELYSIAN is a Cairo agency building websites, web applications, and mobile-ready tools — in Arabic, in English, or both."
    />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The two faces the first screen paints with: the display serif and the
         body sans, latin subset. Starting them here rather than letting the
         stylesheet discover them saves a round trip. The Arabic faces are
         deliberately not preloaded — most first visits are English, and the
         Arabic page pulls its own two families instead of these. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/cormorant-garamond-300-normal-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/jost-300-normal-latin.woff2"
    />

    <!-- Social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ELYSIAN" />
    <meta property="og:title" content="ELYSIAN — websites and applications, built in Cairo" />
    <meta
      property="og:description"
      content="A Cairo agency building websites, web applications, and mobile-ready tools — in Arabic, in English, or both."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ELYSIAN — websites and applications, built in Cairo" />
    <meta
      name="twitter:description"
      content="A Cairo agency building websites, web applications, and mobile-ready tools — in Arabic, in English, or both."
    />

    <!-- og:locale, og:image, canonical, og:url and hreflang differ per language
         and need the deployed origin, so scripts/prerender.mjs writes them into
         each built page from SITE.url in config.ts. Nothing to edit by hand. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
