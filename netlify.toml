# Netlify. If you deploy on Vercel instead, delete this file and keep
# vercel.json — there is no reason to carry both.

[build]
  command = "npm run build"
  publish = "dist"

# Anything Vite bundles gets a content hash in its filename and is cached
# forever automatically. Files served straight out of public/ keep their names,
# so they need these headers set by hand.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shorter, because this one gets regenerated when the hero copy changes and a
# stale preview card is worth avoiding.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
